# Render blueprint — New → Blueprint → select this repo.
# A static site: free, CDN-served, no cold starts.
services:
  - type: web
    name: football-bluelock
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      # public Supabase values (baked into the client at build time)
