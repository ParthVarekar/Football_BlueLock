        value: https://fktpjqykfxmcygaurcmu.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrdHBqcXlrZnhtY3lnYXVyY211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MzkxNzYsImV4cCI6MjEwNjExNTE3Nn0.F-65JMmOC7DmyZJAQp6ewUwENGOOkeWMSzbQgPcNVHQ
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
