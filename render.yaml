# Render blueprint — one Node web service that serves the game AND runs the
# multiplayer rooms (WebSocket relay at /ws). Singapore = lowest latency for India.
# Free plan sleeps after 15 idle minutes; a cron-job.org ping on /health keeps it up.
services:
  - type: web
    name: football-bluelock-live
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
